<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BancoFácil - Acceso</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <section class="access-card">

                    <div class="brand-area">
                        <h1>Banco El Amor De Mi Vida</h1>

                        <p>
                            Accede de forma sencilla y segura
                        </p>
                    </div>

                    <form id="loginForm" novalidate>

                        <div class="mb-4">

                            <label
                                for="usuario"
                                class="form-label"
                            >
                                Número de usuario
                            </label>

                            <input
                                type="text"
                                class="form-control custom-input"
                                id="usuario"
                                name="usuario"
                                autocomplete="username"
                                aria-describedby="usuarioError"
                                required
                            >

                            <div
                                id="usuarioError"
                                class="field-error"
                                role="alert"
                                aria-live="polite"
                            ></div>

                        </div>


                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Contraseña
                            </label>

                            <div class="password-box">

                                <input
                                    type="password"
                                    class="form-control custom-input"
                                    id="password"
                                    name="password"
                                    autocomplete="current-password"
                                    aria-describedby="passwordError"
                                    required
                                >

                                <button
                                    type="button"
                                    id="mostrarPassword"
                                    class="password-button"
                                    aria-label="Mostrar contraseña"
                                >
                                    Mostrar
                                </button>

                            </div>

                            <div
                                id="passwordError"
                                class="field-error"
                                role="alert"
                                aria-live="polite"
                            ></div>

                        </div>


                        <button
                            type="submit"
                            class="btn access-button w-100"
                        >
                            Entrar a mi cuenta
                        </button>

                    </form>

                </section>

            </div>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
